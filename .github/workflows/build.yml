name: Build Swift

on:
  push:
    branches: [main]
    paths:
      - 'swift/**'
      - 'scripts/**'
      - 'mcpb/**'
      - '.codex-plugin/**'
      - '.mcp.json'
      - 'assets/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'swift/**'
      - 'scripts/**'
      - 'mcpb/**'
      - '.codex-plugin/**'
      - '.mcp.json'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: swift

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Version check runs before the build on purpose (fail fast).
      - name: Check version consistency
        working-directory: .
        run: scripts/check-version.sh

      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: swift/.build
          key: ${{ runner.os }}-swift-build-serial-${{ hashFiles('swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-build-serial-

      # Tests are compiled in this step on purpose, so a compile error is
      # attributed to "Build" rather than "Run tests".
      - name: Build (including tests)
        run: swift build --build-tests

      - name: Run tests
        # Serial on purpose. The 2026-09 hang (run 33573931260) was Contacts:
        # hosted macos runners report Contacts as authorized but have no
        # AddressBook daemon, and enumerateContacts retried for minutes per
        # test. ContactResolver.initialize now skips loading when CI=true
        # (GitHub sets it). Serial stays until a workflow_dispatch run of
        # `--parallel` with the guard in place is green; see plan 066.
        run: swift test --skip-build

name: Build Swift

on:
  push:
    branches: [main]
    paths:
      - 'swift/**'
      - 'contract/**'
      - 'scripts/**'
      - 'script/**'
      - 'macos/**'
      - 'mcpb/**'
      - '.codex-plugin/**'
      - '.mcp.json'
      - 'assets/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'swift/**'
      - 'contract/**'
      - 'scripts/**'
      - 'script/**'
      - 'macos/**'
      - 'mcpb/**'
      - '.codex-plugin/**'
      - '.mcp.json'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  # release.yml runs these same checks before it builds a release.
  workflow_call:

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release
  # run never cancels (or is cancelled by) a push build on the same ref.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh script/*.sh

  build:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: swift

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Version check runs before the build on purpose (fail fast).
      - name: Check version consistency
        working-directory: .
        run: scripts/check-version.sh

      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: swift/.build
          key: ${{ runner.os }}-swift-build-serial-${{ hashFiles('swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-build-serial-

      # Tests are compiled in this step on purpose, so a compile error is
      # attributed to "Build" rather than "Run tests".
      - name: Build (including tests)
        run: swift build --build-tests

      - name: Run tests
        # Serial on purpose. The 2026-09 hang (run 33573931260) was Contacts:
        # hosted macos runners report Contacts as authorized but have no
        # AddressBook daemon, and enumerateContacts retried for minutes per
        # test. ContactResolver.initialize now skips loading when CI=true
        # (GitHub sets it). Serial stays until a workflow_dispatch run of
        # `--parallel` with the guard in place is green; see plan 066.
        run: swift test --skip-build

      # The SIGTERM abort (#27) only happened in optimized builds, so the
      # shutdown tests run again against the binary launchd runs.
      - name: Shutdown tests against the release binary
        run: |
          make build
          IMESSAGE_MAX_BINARY=.build/release/imessage-max swift test --skip-build --filter SignalShutdownTests

  companion:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (including tests)
        run: swift build --build-tests

      - name: Run tests
        run: |
          swift test --skip-build --no-parallel 2>&1 | grep -E "started|passed|failed|signal|issue" || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do echo "== $f"; head -c 12000 "$f"; done
          exit 1

      # The wire contract both packages above build against.
      - name: Contract tests
        working-directory: contract
        run: swift test

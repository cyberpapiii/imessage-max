name: Build Swift

on:
  push:
    branches: [main]
    paths:
      - 'swift/**'
      - 'scripts/**'
      - 'mcpb/**'
      - '.codex-plugin/**'
      - '.mcp.json'
      - 'assets/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'swift/**'
      - 'scripts/**'
      - 'mcpb/**'
      - '.codex-plugin/**'
      - '.mcp.json'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: swift

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Version check runs before the build on purpose (fail fast).
      - name: Check version consistency
        working-directory: .
        run: scripts/check-version.sh

      - name: Cache Swift build
        uses: actions/cache@v6
        with:
          path: swift/.build
          key: ${{ runner.os }}-swift-build-${{ hashFiles('swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-build-

      # Tests are compiled in this step on purpose, so a compile error is
      # attributed to "Build" rather than "Run tests".
      - name: Build (including tests)
        run: swift build --build-tests

      - name: Run tests
        run: swift test --skip-build --parallel --verbose 2>&1 | tee "${RUNNER_TEMP}/swift-test-verbose.log"

name: Release Swift

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, notarize, and upload artifacts only. Never create a release or push the cask.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # A dispatch that is not a dry run can publish only from a v* tag. Fail
  # instead of finishing green with nothing released.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a real release from a branch
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "error: turn dry_run off only when dispatching from a v* tag" >&2
          exit 1

  # The same build, test, and companion checks as a push to main.
  checks:
    needs: guard
    uses: ./.github/workflows/build.yml

  # Runs beside checks, so a release waits for the slower of the two instead
  # of both in turn. The release job needs both, so a failed check still
  # blocks publishing.
  dmg:
    needs: guard
    runs-on: macos-26
    # Two notarizations, each allowed up to 30 minutes.
    timeout-minutes: 90
    outputs:
      sha256: ${{ steps.cask.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcodebuild -version
          swift --version

      - name: Build, sign, notarize, and staple the DMG and the Claude Desktop extension
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASS: ${{ secrets.MACOS_CERTIFICATE_PASS }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: scripts/sign-notarize-app.sh dist

      # Every run prints and uploads the cask. Only the release job pushes it.
      - name: Generate the Homebrew cask
        id: cask
        run: |
          VERSION=$(scripts/check-version.sh --print)
          DIGEST=$(shasum -a 256 "dist/iMessage-Max-$VERSION.dmg" | cut -d' ' -f1)
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
          mkdir -p dist/cask
          scripts/generate-cask.sh "$VERSION" "$DIGEST" > dist/cask/imessage-max.rb
          cat dist/cask/imessage-max.rb

      # brew audit loads a cask only by name, from a tap it trusts, so the
      # checks run in a throwaway local tap.
      - name: Check the cask with brew style and brew audit
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          brew tap-new --no-git imessage-max/release-check
          TAP=$(brew --repository imessage-max/release-check)
          mkdir -p "$TAP/Casks"
          cp dist/cask/imessage-max.rb "$TAP/Casks/imessage-max.rb"
          brew trust --tap imessage-max/release-check
          brew style --cask imessage-max/release-check/imessage-max
          brew audit --cask --strict imessage-max/release-check/imessage-max

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iMessage-Max-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload Claude Desktop extension as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iMessage-Max-mcpb
          path: dist/*.mcpb
          if-no-files-found: error

      - name: Upload the cask as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imessage-max-cask
          path: dist/cask/imessage-max.rb
          if-no-files-found: error

  # The cask reaches the tap only after the release holds the DMG it names.
  release:
    needs: [checks, dmg]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            assets/iMessage-Max-*.dmg
            assets/iMessage-Max-*.mcpb
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
          body: |
            Install with `brew install --cask cyberpapiii/tap/imessage-max`, or open the DMG and drag iMessage Max to Applications.

            DMG sha256: `${{ needs.dmg.outputs.sha256 }}`

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cyberpapiii/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Push the cask to the tap
        run: |
          mkdir -p homebrew-tap/Casks
          cp assets/imessage-max.rb homebrew-tap/Casks/imessage-max.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/imessage-max.rb
          if git diff --cached --quiet; then
            echo "Casks/imessage-max.rb is already current"
            exit 0
          fi
          git commit -m "imessage-max ${GITHUB_REF_NAME#v}"
          git push

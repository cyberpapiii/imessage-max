name: Release Swift

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, notarize, and upload artifacts only. Never create a release.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # A dispatch that is not a dry run can publish only from a v* tag. Fail
  # instead of finishing green with nothing released.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a real release from a branch
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "error: turn dry_run off only when dispatching from a v* tag" >&2
          exit 1

  # The same build, test, and companion checks as a push to main.
  checks:
    needs: guard
    uses: ./.github/workflows/build.yml

  build-and-release:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.tarball.outputs.sha256 }}
    defaults:
      run:
        working-directory: swift

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check version consistency (and tag on tag pushes)
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            scripts/check-version.sh --tag
          else
            scripts/check-version.sh
          fi

      # `make build` is the one release build: native build system (so the
      # binary lands in .build/arm64-apple-macosx/release) with the embedded
      # Info.plist. The runner is Apple silicon; the next steps assert arm64.
      - name: Build release binary with embedded Info.plist
        run: make build

      - name: Re-sign binary with bundle identifier
        run: |
          BINARY=".build/arm64-apple-macosx/release/imessage-max"
          BUNDLE_ID="com.cyberpapiii.imessage-max"
          codesign --force --sign - --identifier "$BUNDLE_ID" "$BINARY"
          echo "Verifying code signature..."
          codesign -dvvv "$BINARY" 2>&1 | grep -E "(Identifier|Info.plist)"
          # A non-weak link fails to load on macOS 15, which lacks this dylib.
          if otool -L "$BINARY" | awk '/libswiftCompatibilitySpan\.dylib/ && !/, weak\)/ { found = 1 } END { exit !found }'; then
            echo "error: $BINARY links libswiftCompatibilitySpan.dylib non-weak" >&2
            exit 1
          fi

      - name: Assert architecture, identifier, and version
        run: |
          BINARY=".build/arm64-apple-macosx/release/imessage-max"
          lipo -info "$BINARY" | grep -q "arm64" || { echo "not arm64"; exit 1; }
          codesign -dvv "$BINARY" 2>&1 | grep -q "Identifier=com.cyberpapiii.imessage-max" || { echo "wrong identifier"; exit 1; }
          EXPECTED=$(../scripts/check-version.sh --print)
          REPORTED=$("$BINARY" --version)
          echo "Binary reports version: $REPORTED"
          [[ "$REPORTED" == *"$EXPECTED"* ]] || { echo "version mismatch: binary '$REPORTED' vs Version.swift '$EXPECTED'"; exit 1; }

      - name: Create tarball
        id: tarball
        run: |
          cd .build/arm64-apple-macosx/release
          tar -czvf imessage-max-macos.tar.gz imessage-max
          DIGEST=$(shasum -a 256 imessage-max-macos.tar.gz | cut -d' ' -f1)
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "imessage-max-macos.tar.gz sha256 $DIGEST"
          mv imessage-max-macos.tar.gz "$GITHUB_WORKSPACE/"

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imessage-max-macos
          path: imessage-max-macos.tar.gz

  dmg:
    needs: checks
    runs-on: macos-26
    # Two notarizations, each allowed up to 30 minutes.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build, sign, notarize, and staple the DMG
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASS: ${{ secrets.MACOS_CERTIFICATE_PASS }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: scripts/sign-notarize-app.sh dist

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iMessage-Max-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # One job creates the release, so the tarball and DMG jobs never race to
  # create it.
  release:
    needs: [build-and-release, dmg]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            assets/imessage-max-macos.tar.gz
            assets/iMessage-Max-*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
          body: |
            `imessage-max-macos.tar.gz` sha256: `${{ needs.build-and-release.outputs.sha256 }}`
